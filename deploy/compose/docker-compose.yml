# Локальное окружение (12-security-ops.md §5.1). Redis и MinIO добавляются вместе с функциями,
# которые их используют (кэш Delivery API, ассеты).
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#   docker compose -f deploy/compose/docker-compose.yml run --rm cms bootstrap -slug store -name "Магазин"
name: cms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ../../apps/server
    command: ["migrate", "up"]
    environment: &cms-env
      CMS_DATABASE_URL: postgres://cms:cms@postgres:5432/cms?sslmode=disable
      CMS_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  cms:
    build: ../../apps/server
    command: ["serve"]
    environment:
      <<: *cms-env
      CMS_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:

# STU-607: local observability backend (decision §11.2 of docs/observability.md).
# Grafana with Tempo (traces), Prometheus (metrics) and the OpenTelemetry Collector in one
# container; the CMS exports to it over OTLP/HTTP. Usage: docs/observability-local.md.
#
#   docker compose -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.observability.yml up --build
services:
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "127.0.0.1:3000:3000" # Grafana (admin/admin)
      - "127.0.0.1:4318:4318" # OTLP/HTTP for processes run on the host

  cms:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_SERVICE_NAME: cms
      CMS_DEPLOYMENT_ENV: local
    depends_on:
      lgtm:
        condition: service_started

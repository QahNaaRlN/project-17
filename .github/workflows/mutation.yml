name: Mutation

on:
  schedule:
    - cron: "17 3 * * 1" # понедельник, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker + Gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # По одному пакету: параллельный запуск вызывает ложные тайм-ауты Gremlins.
      - run: pnpm -r --workspace-concurrency=1 --if-present test:mutation
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: packages/*/reports/mutation/
          if-no-files-found: ignore

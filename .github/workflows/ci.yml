name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (TS + Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm через Corepack (встроен в Node): версия закреплена в packageManager package.json.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Local development OIDC fixture
        run: node --test scripts/dev-oidc.test.mjs
      - name: Generated files are up to date
        run: |
          pnpm gen
          git diff --exit-code || {
            echo "::error::Сгенерированные файлы устарели: выполните 'pnpm gen' и закоммитьте результат"
            exit 1
          }
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The check runner tests (STU-490/491) and the storefront scenarios need Chromium.
      - run: pnpm --filter @cms/store-example exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - name: Storefront browser scenarios
        run: pnpm --filter @cms/store-example test:e2e
      - name: Browser failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-context
          path: examples/react-store/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

  # STU-456: the MVP §2 scenario against the real CMS stand. Required for PRs
  # into dev and main after five consecutive green runs (decision §11.1).
  e2e-scenario:
    name: E2E scenario (§2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CMS_DATABASE_URL: postgres://postgres:local@127.0.0.1:5432/e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      # The runner context is not available in job-level env.
      - run: echo "E2E_DIR=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Build the CMS with the e2e tag, Studio and the store
        run: |
          mkdir -p "$E2E_DIR"
          (cd apps/server && go vet -tags e2e ./internal/capabilitygithub && go test -tags e2e -count=1 -run STU445 ./internal/capabilitygithub && go build -tags e2e -o "$E2E_DIR/cms" ./cmd/cms)
          pnpm exec turbo run build --filter @cms/studio --filter @cms/store-example --filter @cms/check-runner
      - run: pnpm --filter @cms/store-example exec playwright install --with-deps chromium
      - name: Scenario §2
        run: E2E_SKIP_BUILD=true pnpm e2e:scenario
      - name: Scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scenario
          path: |
            ${{ runner.temp }}/e2e/**
            !${{ runner.temp }}/e2e/**/*.private.*
            !${{ runner.temp }}/e2e/cms
            examples/react-store/test-results/scenario/**
            examples/react-store/test-results/scenario-report.json
          if-no-files-found: warn
          retention-days: 7

  # STU-500/501: dependency and image scanners (SEC-007). High and critical
  # findings are never excepted; govulncheck fails on called vulnerabilities.
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit with exceptions
        run: |
          node --test scripts/security-audit.test.mjs
          node scripts/security-audit.mjs
      - name: govulncheck
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build server image
        run: docker build -t cms/server:security apps/server
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cms/server:security
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build server image
        run: docker build --build-arg VERSION=${{ github.sha }} -t cms/server:ci apps/server
      - name: Smoke test
        run: docker run --rm cms/server:ci version
